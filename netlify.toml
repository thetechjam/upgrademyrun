[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Canonicalize alternate domains to the apex.
[[redirects]]
  from = "https://upgrademyruns.com/*"
  to = "https://upgrademyrun.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.upgrademyruns.com/*"
  to = "https://upgrademyrun.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.upgrademyrun.com/*"
  to = "https://upgrademyrun.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
